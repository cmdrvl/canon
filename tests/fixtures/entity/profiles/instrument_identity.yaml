# canon entity profile template: instrument_identity
# Identity semantics: same financial instrument, not same issuer.
# Non-goal: issuer LEI is an issued_by relation hint only; it is not
# same-instrument support and must not collapse instruments or share classes.
profile: instrument_identity
version: 0.1.0
entity_type: instrument
identity_semantics: identifies_same_instrument
canonical_type: instrument
required_fields:
  - source_row_id
  - report_period
  - title
  - cusip
  - isin
  - maturitydt
  - annualizedrt
  - issuer_lei
normalized_views:
  core:
    operators:
      - unicode_fold
      - lowercase
      - normalize_whitespace
  title_tokens:
    operators:
      - unicode_fold
      - lowercase
      - tokenize
  cusip:
    operators:
      - ascii_trim_upper
      - placeholder_to_null
  isin:
    operators:
      - ascii_trim_upper
      - placeholder_to_null
  instrument_maturity:
    operators:
      - ascii_trim_upper
      - placeholder_to_null
  annualized_rate:
    operators:
      - ascii_trim_upper
      - placeholder_to_null
  share_class:
    operators:
      - ascii_trim_upper
      - placeholder_to_null
prepare:
  primary_surface_fields:
    - title
  canonical_surface_normalized_view: core
  normalized_view_fields:
    core: title
    title_tokens: title
    cusip: cusip
    isin: isin
    instrument_maturity: maturitydt
    annualized_rate: annualizedrt
    share_class: share_class
  anchor_fields:
    figi: figi
  placeholder_values:
    - "N/A"
    - "NA"
    - "NONE"
    - "NULL"
    - "UNKNOWN"
    - "000000000"
  context_fields:
    - report_period
    - issuer_lei
    - share_class
  provenance_fields:
    - source_row_id
    - report_period
  # One surface per per-period identifier tuple (Proof Case 0 grain). A title
  # key would silently merge re-CUSIPs and same-title/different-maturity
  # instruments into one surface before evidence ever runs.
  surface_key_fields:
    - core
    - cusip
    - isin
    - instrument_maturity
    - annualized_rate
    - issuer_lei
    - report_period
  # Identifier and attribute columns must exist but may be empty on a row:
  # an absent identifier is not a malformed observation.
  nullable_fields:
    - cusip
    - isin
    - maturitydt
    - annualizedrt
    - issuer_lei
evidence:
  support:
    - op: exact_view
      view: cusip
      params:
        score_units: "8500"
    - op: exact_view
      view: isin
      params:
        score_units: "8500"
    - op: anchor_match
      params:
        field: figi
        score_units: "9000"
    - op: isin_cusip_arithmetic
      params:
        cusip_field: cusip
        isin_field: isin
        score_units: "7000"
  cannot_link:
    - op: anchor_conflict
      params:
        field: figi
        score_units: "10000"
    - op: attribute_conflict
      params:
        field: instrument_maturity
        comparison: date
        score_units: "10000"
    - op: attribute_conflict
      params:
        field: annualized_rate
        comparison: decimal_bps
        rate_scale: percent
        tolerance_bps: "1"
        score_units: "10000"
  relation_hints:
    - op: issued_by
      params:
        field: issuer_lei
        target_entity_type: issuer
        merge_authorized: "false"
        review_policy: relation_hint_only
    - op: superseded_by
      params:
        field: report_period
        merge_authorized: "false"
        review_policy: temporal_relation_only
patch_namespaces:
  aliases: instrument_identity.aliases
  distinct: instrument_identity.distinct
  relations: instrument_identity.relations
