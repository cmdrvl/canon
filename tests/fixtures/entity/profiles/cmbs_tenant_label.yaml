# Non-goal: this does not claim legal-entity, obligor, investor, owner,
# brand-hierarchy, or successor identity.
profile: cmbs_tenant_label
version: 0.1.0
entity_type: tenant_label
identity_semantics: canonical_display_label
canonical_type: tenant_label
required_fields:
  - source_row_id
  - deal_id
  - loan_id
  - property_id
  - raw_tenant_name
normalized_views:
  tenant_core:
    operators:
      - legal_basename
  tenant_tokens:
    operators:
      - legal_basename_tokens
  tenant_brand:
    operators:
      - legal_basename_fingerprint
prepare:
  primary_surface_fields: [raw_tenant_name]
  canonical_surface_normalized_view: tenant_core
  normalized_view_fields:
    tenant_core: raw_tenant_name
    tenant_tokens: raw_tenant_name
    tenant_brand: raw_tenant_name
  alias_surfaces_field: alias_surfaces_json
  mention_surfaces_field: mention_surfaces_json
  context_fields: [deal_id, loan_id, property_id]
  provenance_fields: [source_row_id, deal_id, loan_id, property_id]
blocking:
  operators:
    - op: exact_identity
      view: tenant_core
    - op: ngram_topk
      view: tenant_core
      k: 25
      candidate_cap: 25
    - op: rare_token_overlap
      view: tenant_core
      token_views: [tenant_core, tenant_tokens, tenant_brand]
      include_primary_surface: true
      k: 25
      candidate_cap: 25
      max_posting_size: 1000
evidence:
  support:
    - op: exact_view
      view: tenant_core
    - op: string_similarity
      view: tenant_core
    - op: tfidf_cosine
      view: tenant_tokens
    - op: alias_patch_match
      view: tenant_core
  cannot_link:
    - op: protected_token_conflict
      view: tenant_tokens
    - op: related_distinct_phrase
      view: tenant_core
    - op: same_property_distinct_rank
  relation_hints:
    - op: related_brand_family
      view: tenant_brand
      params:
        merge_authorized: "false"
        review_policy: relation_hint_only
    - op: possible_successor_predecessor
      view: tenant_brand
      params:
        merge_authorized: "false"
        review_policy: relation_hint_only
    - op: cross_profile_alignment
      params:
        merge_authorized: "false"
        review_policy: relation_hint_only
patch_namespaces:
  aliases: cmbs_tenant_label.aliases
  distinct: cmbs_tenant_label.distinct
  relations: cmbs_tenant_label.relations
