<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canon Entity Review</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #5f6b7a;
      --line: #d8dee6;
      --accent: #246b62;
      --warn: #9b4d00;
      --bad: #9f2436;
      --good: #1d6f42;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.96);
      padding: 14px 18px;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }
    main {
      display: grid;
      grid-template-columns: minmax(220px, 320px) 1fr;
      gap: 16px;
      padding: 16px;
    }
    aside, section.review-item {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    aside {
      align-self: start;
      position: sticky;
      top: 64px;
      padding: 12px;
    }
    .meta {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 5px 10px;
      margin: 0 0 12px;
    }
    .meta dt {
      color: var(--muted);
      font-weight: 600;
    }
    .meta dd {
      margin: 0;
      overflow-wrap: anywhere;
    }
    .filters {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--text);
      padding: 6px 9px;
      font: inherit;
      cursor: pointer;
    }
    button[aria-pressed="true"] {
      border-color: var(--accent);
      background: #e7f3f0;
      color: #164b45;
    }
    #items {
      display: grid;
      gap: 12px;
    }
    section.review-item {
      padding: 14px;
    }
    .item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .item-title {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }
    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      color: var(--muted);
      white-space: nowrap;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .block {
      border-top: 1px solid var(--line);
      padding-top: 10px;
      margin-top: 10px;
    }
    .block h3 {
      margin: 0 0 6px;
      font-size: 13px;
      letter-spacing: 0;
      color: var(--muted);
    }
    ul {
      margin: 0;
      padding-left: 18px;
    }
    li {
      overflow-wrap: anywhere;
    }
    .decision {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      margin-top: 10px;
    }
    .decision label {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfd;
      text-align: center;
      color: var(--muted);
    }
    .decision input {
      margin-right: 5px;
    }
    .conflict { color: var(--bad); }
    .cue { color: var(--warn); }
    .ok { color: var(--good); }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      aside { position: static; }
      .grid, .decision { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <script type="application/json" id="review-data">__CANON_NATIVE_REVIEW_JSON__</script>
  <header>
    <h1>Canon Entity Review</h1>
  </header>
  <main>
    <aside>
      <dl class="meta" id="summary"></dl>
      <div class="filters" role="group" aria-label="Mode filter">
        <button type="button" data-mode="all" aria-pressed="true">All</button>
        <button type="button" data-mode="cluster" aria-pressed="false">Clusters</button>
        <button type="button" data-mode="link" aria-pressed="false">Links</button>
      </div>
    </aside>
    <div id="items"></div>
  </main>
  <script>
    const data = JSON.parse(document.getElementById("review-data").textContent);
    const state = { mode: "all" };
    const text = (value) => value == null ? "" : String(value);
    const li = (value, className = "") => `<li${className ? ` class="${className}"` : ""}>${escapeHtml(value)}</li>`;
    const escapeHtml = (value) => text(value).replace(/[&<>"']/g, (char) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      "\"": "&quot;",
      "'": "&#39;"
    }[char]));
    function renderSummary() {
      const summary = document.getElementById("summary");
      const rows = [
        ["Artifact", data.artifact_content_hash],
        ["Queue", data.binding.source_review_queue_hash],
        ["Run", data.binding.run_content_hash],
        ["Policy", data.binding.policy_content_hash],
        ["Registry", `${data.binding.registry_id}@${data.binding.registry_version}`],
        ["Profile", data.binding.profile_id],
        ["Items", data.summary.counts.review_items]
      ];
      summary.innerHTML = rows.map(([key, value]) => `<dt>${escapeHtml(key)}</dt><dd>${escapeHtml(value)}</dd>`).join("");
    }
    function renderItems() {
      const root = document.getElementById("items");
      const items = data.review_items.filter((item) => state.mode === "all" || item.mode === state.mode);
      root.innerHTML = items.map(renderItem).join("");
    }
    function renderItem(item) {
      const surfaces = item.mode_context.surface_ids || [item.mode_context.left_surface_id, item.mode_context.right_surface_id];
      const conflicts = item.conflicts.length
        ? item.conflicts.map((conflict) => li(`${conflict.reason_code}: ${conflict.surface_ids.join(", ")}`, "conflict")).join("")
        : li("none", "ok");
      const cues = item.related_distinct_cues.length
        ? item.related_distinct_cues.map((cue) => li(`${cue.reason_code}: ${cue.left_surface_id} / ${cue.right_surface_id}`, "cue")).join("")
        : li("none", "ok");
      return `
        <section class="review-item" data-mode="${escapeHtml(item.mode)}">
          <div class="item-head">
            <h2 class="item-title">${escapeHtml(item.review_id)}</h2>
            <span class="badge">${escapeHtml(item.mode)}</span>
          </div>
          <div class="grid">
            <div><strong>Action</strong><br>${escapeHtml(item.recommended_action)}</div>
            <div><strong>Rows</strong><br>${escapeHtml(item.impact.affected_rows)}</div>
            <div><strong>Decision hash</strong><br>${escapeHtml(item.decision_binding_hash)}</div>
          </div>
          <div class="block"><h3>Surfaces</h3><ul>${surfaces.map(li).join("")}</ul></div>
          <div class="block"><h3>Evidence Waterfall</h3><ul>${item.evidence_waterfall_refs.map((ref) => li(`${ref.lane}: ${ref.left_surface_id} / ${ref.right_surface_id} score=${ref.score_units}`)).join("") || li("none")}</ul></div>
          <div class="block"><h3>Conflicts</h3><ul>${conflicts}</ul></div>
          <div class="block"><h3>Related Distinct Cues</h3><ul>${cues}</ul></div>
          <div class="block"><h3>Provenance</h3><ul>${item.provenance.map((row) => li(`${row.surface_id} ${row.row_id} ${row.source}: ${row.raw_value}`)).join("") || li("none")}</ul></div>
          <form class="decision" aria-label="Decision ${escapeHtml(item.review_id)}">
            ${item.allowed_actions.map((action) => `<label><input type="radio" name="${escapeHtml(item.review_id)}" value="${escapeHtml(action)}">${escapeHtml(action)}</label>`).join("")}
          </form>
        </section>
      `;
    }
    document.querySelectorAll("[data-mode]").forEach((button) => {
      button.addEventListener("click", () => {
        state.mode = button.dataset.mode;
        document.querySelectorAll("[data-mode]").forEach((candidate) => {
          candidate.setAttribute("aria-pressed", String(candidate === button));
        });
        renderItems();
      });
    });
    renderSummary();
    renderItems();
  </script>
</body>
</html>
