[package]
name = "canon"
version = "0.12.1"
edition = "2024"

[[bin]]
name = "canon"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
base64 = "0.22"
sha2 = "0.10"
petgraph = "0.6"
ureq = { version = "2", features = ["json"] }
rapidfuzz = "=0.5.0"
h3o = { version = "=0.10.0", default-features = false }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
tiny_http = "0.12"
spine-rules = { git = "https://github.com/cmdrvl/spine-rules" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
