[package]
name = "canon"
version = "0.16.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "canon"
path = "src/main.rs"

[[bin]]
name = "canon_geo_measurements"
path = "src/bin/canon_geo_measurements.rs"
required-features = ["geo"]

[[bench]]
name = "geo_residual_representations"
required-features = ["geo"]

# The default build is the core: lookup, registry, and the evidence-session
# engine. `geo` adds the Geo workbench (`canon geo ...`, src/geo, and the
# canon_geo_measurements bin). `workbench` adds the legacy entity workbench
# leaves (`canon entity alias-withholding` and `generalization`, src/evaluation;
# more leaves move behind it in later stages of bd-1pjc). Release and CI builds
# use `--all-features`, so the shipped binary keeps every command.
[features]
default = []
geo = ["dep:h3o", "dep:libc", "dep:sha2", "dep:base64"]
workbench = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
parquet = { version = "=56.2.1", default-features = false, features = ["json", "snap"] }
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", optional = true }
petgraph = "0.6"
ureq = { version = "2", features = ["json"] }
rapidfuzz = "=0.5.0"
h3o = { version = "=0.10.0", default-features = false, optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
tiny_http = "0.12"
flate2 = "=1.1.9"
spine-rules = { git = "https://github.com/cmdrvl/spine-rules" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Test targets that need the `geo` feature: every geo_* target, and the
# contract targets that compare the whole CLI surface with operator.json.
[[test]]
name = "canon_v1_contract_inventory"
required-features = ["geo", "workbench"]

[[test]]
name = "command_contract"
required-features = ["geo", "workbench"]

[[test]]
name = "contract_parity"
required-features = ["geo", "workbench"]

