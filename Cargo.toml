[package]
name = "canon"
version = "0.16.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "canon"
path = "src/main.rs"

[[bin]]
name = "canon_geo_measurements"
path = "src/bin/canon_geo_measurements.rs"
required-features = ["geo"]

[[bench]]
name = "geo_residual_representations"
required-features = ["geo"]

# The default build is the core: lookup, registry, and the evidence-session
# engine. `geo` adds the Geo workbench (`canon geo ...`, src/geo, and the
# canon_geo_measurements bin). `workbench` adds the legacy link workbench
# (`canon entity link`, src/resolve, src/entity/link.rs, and the link paths of
# review export and promote). Release and CI builds use `--all-features`, so the
# shipped binary keeps every command.
[features]
default = []
# Geo reads the multi-source link module, which is workbench code, so `geo`
# turns `workbench` on. Without that, `--features geo` alone did not compile.
geo = ["workbench", "dep:h3o", "dep:libc", "dep:sha2", "dep:base64"]
workbench = []
# Test layer only; changes no code. Every target in tests/ requires it, so plain
# `cargo test` runs unit tests and doctests. `cargo test --features integration`
# adds the CLI and pipeline tests for the core; `--all-features` runs everything.
# A new file in tests/ needs a [[test]] entry below.
integration = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
# Parquet and XLSX lookup input. `default-features = false` keeps its
# `preserve-order` feature off: that one changes the key order of canon's own
# JSON output. `zstd` is its only other default.
cmdrvl-tabular = { git = "https://github.com/cmdrvl/tabular", rev = "57c3085627ff06ae56f14c96f191b53415eb848e", default-features = false, features = ["zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
parquet = { version = "=56.2.1", default-features = false, features = ["json", "snap"] }
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", optional = true }
petgraph = "0.6"
ureq = { version = "2", features = ["json"] }
rapidfuzz = "=0.5.0"
h3o = { version = "=0.10.0", default-features = false, optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
tiny_http = "0.12"
flate2 = "=1.1.9"
# Tests write their own XLSX input. Same version cmdrvl-tabular pulls in.
zip = { version = "9.0", default-features = false, features = ["deflate"] }
spine-rules = { git = "https://github.com/cmdrvl/spine-rules" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

