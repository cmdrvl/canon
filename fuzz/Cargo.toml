[package]
name = "canon-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
blake3 = "1"
canon = { path = ".." }
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "manifest_parser"
path = "fuzz_targets/manifest_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registry_package"
path = "fuzz_targets/registry_package.rs"
test = false
doc = false
bench = false

[[bin]]
name = "csv_jsonl_input"
path = "fuzz_targets/csv_jsonl_input.rs"
test = false
doc = false
bench = false
