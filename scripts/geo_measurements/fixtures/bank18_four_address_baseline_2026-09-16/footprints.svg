<text x="35" y="1035" font-size="13">Sources: NYC DCP / OTI; Overture Maps Foundation and OpenStreetMap contributors (building data: ODbL-1.0).</text>
<text x="35" y="1056" font-size="13">Address data: source-specific terms. Exact source records, releases, candidate IDs and limitations: measurement.json.</text>
<text x="35" y="1100" font-size="15" font-weight="bold">How to read this</text>
<text x="35" y="1125" font-size="14">Brooklyn shows the source-linked building. San Francisco and Austin show only the point-containing candidate.</text>
<text x="35" y="1148" font-size="14">Clyde shows all four footprints from the bounded Census-point query. Nearby does not establish address membership.</text>
<text x="35" y="1171" font-size="14">No complete native address-to-building run or independent building-identity verification was demonstrated.</text>
