<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">BANK 2019-BNK18: four address baseline</title>
<desc id="desc">Source building outlines and address points. Census points lie outside the displayed footprints. Separate source address points fall within one candidate in San Francisco and Austin, but not Clyde. These are 2026 source geometries, not verified 2019 collateral boundaries.</desc>
