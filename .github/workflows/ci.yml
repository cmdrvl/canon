name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  release:
    types: ["published"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Plain `cargo test` is unit tests and doctests only: every target in tests/
  # requires the `integration` feature.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run unit tests
        run: cargo test

  # Unit and integration tests together; --all-features turns `integration` on.
  test:
    name: Test (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-features

  # The default build is the core (lookup, registry, evidence sessions). The
  # jobs above and the release build use --all-features; this one keeps the
  # core profile green on its own.
  core:
    name: Core profile (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-targets --features integration -- -D warnings
      - name: Run tests
        run: cargo test --features integration

  reachability:
    name: Reachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check every src file compiles into a target
        run: ./scripts/check-reachability.sh

  safety-matrix:
    name: Safety Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run safety matrix
        run: cargo test --test safety_matrix --test geo_geometry --test geo_geometry_value --all-features

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        if: runner.os != 'Windows'
      # Measurement-only fixtures use filenames that Windows cannot check out.
      - uses: actions/checkout@v4
        if: runner.os == 'Windows'
        # Permit index-only paths while sparse checkout keeps them off disk.
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: 'false'
        with:
          sparse-checkout: |
            /*
            !/scripts/geo_measurements/fixtures/
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --all-features
      - name: Smoke test binary
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
            ./target/release/canon --version
            ./target/release/canon --help || true
          else
            ./target/release/canon.exe --version
            ./target/release/canon.exe --help || true
          fi
        shell: bash

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [fmt, clippy, unit, test, core, reachability, safety-matrix, build]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ]]; then
            echo "Format job failed"
            exit 1
          fi
          if [[ "${{ needs.clippy.result }}" != "success" ]]; then
            echo "Clippy job failed"
            exit 1
          fi
          if [[ "${{ needs.unit.result }}" != "success" ]]; then
            echo "Unit test job failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test job failed"
            exit 1
          fi
          if [[ "${{ needs.core.result }}" != "success" ]]; then
            echo "Core profile job failed"
            exit 1
          fi
          if [[ "${{ needs.reachability.result }}" != "success" ]]; then
            echo "Reachability job failed"
            exit 1
          fi
          if [[ "${{ needs.safety-matrix.result }}" != "success" ]]; then
            echo "Safety matrix job failed"
            exit 1
          fi
          if [[ "${{ needs.build.result }}" != "success" && "${{ needs.build.result }}" != "skipped" ]]; then
            echo "Build job failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"
